spring:
  application:
    name: TechHouse

  datasource:
    url: jdbc:postgresql://localhost:5432/techhouse
    username: techhouse
    password: techhouse_dev
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  jackson:
    default-property-inclusion: non_null
    datatype:
      datetime:
        write-dates-as-timestamps: false

server:
  port: 8080

app:
  admin:
    # Initial OWNER account, created at startup only when both are set (see AdminSeeder).
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    display-name: ${ADMIN_DISPLAY_NAME:Admin}
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-256-bits-long-for-hs256}
    access-token-expiration: 15m
    refresh-token-expiration: 7d
  exchange-rate:
    # SPToday (https://sp-today.com). Without a key the app runs on manually entered rates only.
    api-url: ${RATE_API_URL:https://api-v2.sp-today.com/api/v1}
    api-key: ${RATE_API_KEY:}
    # Safety margin under the free tier's 100 calls/month.
    max-monthly-calls: ${RATE_API_MAX_MONTHLY_CALLS:90}
    # Twice a day, Damascus time: about 60 calls a month, leaving room for manual refreshes.
    cron: ${RATE_API_CRON:0 0 10,16 * * *}
    fetch-on-startup: ${RATE_FETCH_ON_STARTUP:true}
    retry-backoff: 2s
    # A new rate this far from the last approved one waits for review instead of being used.
    max-jump-percent: 20
