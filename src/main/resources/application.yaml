spring:
  application:
    name: TechHouse

  datasource:
    url: jdbc:postgresql://localhost:5432/techhouse
    username: techhouse
    password: techhouse_dev
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    datatype:
      datetime:
        write-dates-as-timestamps: false

server:
  port: 8080

app:
  admin:
    # Initial OWNER account, created at startup only when both are set (see AdminSeeder).
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    display-name: ${ADMIN_DISPLAY_NAME:Admin}
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-256-bits-long-for-hs256}
    access-token-expiration: 15m
    refresh-token-expiration: 7d
  exchange-rate:
    api-url: ${RATE_API_URL:}
    api-key: ${RATE_API_KEY:}
    max-monthly-calls: 90
