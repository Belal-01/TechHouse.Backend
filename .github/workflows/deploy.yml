name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/belal-01/techhouse-backend

jobs:
  test:
    runs-on: ubuntu-latest
    # Matches the datasource in application.yaml (localhost:5432/techhouse)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: techhouse
          POSTGRES_USER: techhouse
          POSTGRES_PASSWORD: techhouse_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techhouse -d techhouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Testcontainers needs Docker, which ubuntu runners provide
      - run: ./mvnw -B verify

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer redeploy
        run: |
          curl --fail --show-error --silent -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
